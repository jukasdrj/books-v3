openapi: 3.1.0
info:
  title: BooksTrack API V2
  version: 2.0.0
  description: |
    ## V2 API Contract - iOS Primary Integration

    This specification covers ONLY the V2 endpoints that iOS should use.
    All V1/legacy endpoints are deprecated and will be removed March 1, 2026.

    ### Response Format

    All V2 endpoints return the unified ResponseEnvelope:
    ```json
    {
      "success": true,
      "data": { ... },
      "metadata": { "timestamp": "...", "source": "...", "cached": false },
      "error": null
    }
    ```

    ### Authentication

    Most endpoints require no authentication. Job cancellation and WebSocket reconnection
    require a Bearer token issued at job creation.

  contact:
    email: api-support@oooefam.net
  license:
    name: Proprietary
servers:
