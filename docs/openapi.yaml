        ```json
        {
          "success": true,
          "data": {
            "weekOf": "2025-12-01",
            "recommendations": [
              {
                "isbn": "9780439708180",
                "title": "Harry Potter and the Sorcerer's Stone",
                "author": "J.K. Rowling",
                "coverUrl": "https://...",
                "reason": "Classic fantasy adventure"
              }
            ],
            "count": 10,
            "totalAvailable": 20
          },
          "metadata": {
            "timestamp": "2025-12-01T00:00:00Z",
            "source": "kv-cache",
            "cached": true,
            "generatedAt": "2025-11-30T00:00:00Z"
          }
        }
        ```
      parameters:
        - name: limit
          in: query
          description: Number of recommendations to return (1-20)
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
      responses:
        '200':
          description: Weekly recommendations retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      weekOf:
                        type: string
                        format: date
                        example: "2025-12-01"
                      recommendations:
                        type: array
                        items:
                          type: object
                          properties:
                            isbn:
                              type: string
                              example: "9780439708180"
                            title:
                              type: string
                              example: "Harry Potter and the Sorcerer's Stone"
                            author:
                              type: string
                              example: "J.K. Rowling"
                            coverUrl:
                              type: string
                              format: uri
                            reason:
                              type: string
                              example: "Classic fantasy adventure"
                            score:
                              type: number
                              minimum: 0
                              maximum: 100
                          required:
                            - isbn
                            - title
                            - author
                            - reason
                      count:
                        type: integer
                        example: 10
                      totalAvailable:
                        type: integer
                        example: 20
                      message:
                        type: string
                        description: Info message when no recommendations available
                    required:
                      - weekOf
                      - recommendations
                      - count
                      - totalAvailable
                  metadata:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        format: date-time
                      source:
                        type: string
                        enum: [kv-cache, d1-database, none]
                      cached:
                        type: boolean
                      generatedAt:
                        type: string
                        format: date-time
                      expiresAt:
                        type: string
                        format: date-time
                      nextGenerationTime:
                        type: string
                        format: date-time
                required:
                  - success
                  - data
                  - metadata
