openapi: 3.1.0
info:
  title: BooksTrack API
  version: 3.4.0
  description: Book search, enrichment, and AI-powered scanning API
  contact:
    email: api-support@oooefam.net
servers:
  - url: https://api.oooefam.net
    description: Production
  - url: http://localhost:8787
    description: Local development
tags:
  - name: Search
    description: Book and author search operations
  - name: Enrichment
    description: Book metadata enrichment
  - name: Import
    description: CSV import and batch processing
  - name: Scanning
    description: Bookshelf photo scanning
  - name: Discovery
    description: Trending content and recommendations
  - name: Health
    description: System health and monitoring
components:
  schemas: {}
  parameters: {}
paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check endpoint
      description: |-

        Simple health check that returns worker status.

        Returns basic worker information for monitoring purposes:
        - **status**: Health status indicator (always "ok" when responding)
        - **worker**: Worker service name
        - **version**: API version
        - **router**: Router framework type

        **Example:** `GET /health`

        This endpoint is publicly accessible and requires no authentication.
        Use it for:
        - Monitoring and uptime checks
        - Load balancer health gates
        - CI/CD pipeline verification
          
      responses:
        '200':
          description: Health check successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - ok
                        description: Health status indicator
                      worker:
                        type: string
                        description: Worker service name
                      version:
                        type: string
                        description: API version
                      router:
                        type: string
                        enum:
                          - hono
                        description: Router framework
                    required:
                      - status
                      - worker
                      - version
                      - router
                    additionalProperties: false
                  metadata:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        format: date-time
                        description: ISO 8601 timestamp
                    required:
                      - timestamp
                    additionalProperties: false
                required:
                  - data
                additionalProperties: false
              example:
                data:
                  status: ok
                  worker: api-worker
                  version: 2.1.0
                  router: hono
                metadata:
                  timestamp: '2025-11-28T12:00:00.000Z'
  /v1/search/isbn:
    get:
      tags:
        - Search
      summary: Search for a book by ISBN
      description: >-

        Search for a book by ISBN-10 or ISBN-13 (digits only, no hyphens).


        Returns comprehensive book data including:

        - Works: Abstract creative works (title, description, subjects)

        - Editions: Physical/digital editions (publisher, publication date,
        format)

        - Authors: Author biographical data (name, gender, cultural region)


        **Example:** `GET /v1/search/isbn?isbn=9780439708180`


        **Multi-Provider Orchestration:**

        1. BookRepository (KV/D1 cache) - fastest

        2. Google Books API - primary source

        3. OpenLibrary API - fallback #1

        4. ISBNdb API - fallback #2


        **Cache TTL:** 24 hours (KV), permanent (D1)


        **Rate Limits:**

        - 100 requests/minute per IP

        - 1000 requests/hour per IP


        **Circuit Breaker Protection:**

        All external providers are protected by circuit breakers.

        If a provider's circuit is OPEN, the request fails fast with
        `CIRCUIT_OPEN` error.
          
      parameters:
        - schema:
            type: string
            minLength: 10
            maxLength: 13
            pattern: ^\d{10}$|^\d{13}$
            description: ISBN-10 or ISBN-13 (digits only, no hyphens)
          required: true
          description: ISBN-10 or ISBN-13 (digits only, no hyphens)
          name: isbn
          in: query
      responses:
