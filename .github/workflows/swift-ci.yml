name: Swift CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  # Lint check (non-blocking initially - for evaluation)
  lint:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4

    - name: Install SwiftLint
      run: |
        # Use Mint for consistent versioning
        brew install mint
        mint install realm/SwiftLint@0.57.0

    - name: Run SwiftLint
      run: |
        # Run linting (strict mode - critical issues fixed)
        mint run swiftlint lint --reporter github-actions-logging

        # Generate report for review
        mint run swiftlint lint --reporter json > swiftlint-report.json

    - name: Upload lint report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: swiftlint-report
        path: swiftlint-report.json

  build-and-test:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_16.2.app

    - name: Build
      run: |
        xcodebuild clean build \
          -scheme BooksTracker \
          -destination 'platform=iOS Simulator,name=iPhone 16 Pro Max,OS=18.2' \
          -configuration Debug \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          ONLY_ACTIVE_ARCH=NO \
          | xcbeautify

    - name: Run Tests
      run: |
        xcodebuild test \
          -scheme BooksTracker \
          -destination 'platform=iOS Simulator,name=iPhone 16 Pro Max,OS=18.2' \
          -testPlan BooksTrackerTests \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          | xcbeautify

    - name: Check for Warnings
      run: |
        # Fail if any warnings (Zero Warnings Policy)
        if xcodebuild build -scheme BooksTracker -destination 'platform=iOS Simulator,name=iPhone 16 Pro Max,OS=18.2' 2>&1 | grep -i warning; then
          echo "❌ Build contains warnings - Zero Warnings Policy violated!"
          exit 1
        else
          echo "✅ Zero warnings - build passed!"
        fi
